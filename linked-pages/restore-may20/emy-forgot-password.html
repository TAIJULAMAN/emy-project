<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" data-emy-font-inter-async />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-emy-font-inter-async />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" data-emy-font-inter-async />
    <noscript data-emy-font-inter-async><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>
<title>EMY | Forgot Password</title>
    <style>
      :root {
        --emy-navy: #001b47;
        --emy-orange: #ff6a00;
        --emy-cream: #fff8ef;
        --emy-muted: #706b7b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--emy-cream); color: var(--emy-navy); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; overflow-x: hidden; }
      button, input { font: inherit; }
      .page { position: relative; min-height: 100dvh; overflow: hidden; background: radial-gradient(circle at 80% 7%, rgba(255,106,0,.10), transparent 16rem), linear-gradient(180deg, #fff8ef 0%, #fffdf8 58%, #fff8ef 100%); }
      .marks { pointer-events: none; position: absolute; inset: 0; color: rgba(255,106,0,.18); }
      .mark-top { position: absolute; right: clamp(10px, 14vw, 280px); top: -18px; width: 150px; height: 150px; }
      .mark-bottom { position: absolute; left: -42px; bottom: -20px; width: 260px; height: 170px; }
      .back { position: fixed; left: 18px; top: 17px; z-index: 5; height: 38px; width: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--emy-navy); cursor: pointer; display: grid; place-items: center; }
      .back svg { height: 22px; width: 22px; stroke-width: 2.4; }
      .back:hover { background: rgba(255,106,0,.08); color: var(--emy-orange); }
      .wrap { position: relative; z-index: 2; width: min(100%, 430px); min-height: 100dvh; margin: 0 auto; padding: clamp(58px, 9vh, 86px) 18px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; }
      .brand img { height: 50px; width: auto; display: block; }
      h1 { margin: 28px 0 0; font-size: clamp(27px, 7vw, 34px); line-height: 1.08; letter-spacing: 0; font-weight: 760; color: #171435; }
      .intro { margin: 10px auto 0; max-width: 270px; color: #4f5b73; font-size: 13px; line-height: 1.35; font-weight: 500; }
      .note { margin: 20px auto 0; color: #8a8396; font-size: 12.5px; line-height: 1.4; font-weight: 500; }
      form { width: 100%; margin-top: 12px; text-align: left; }
      .field { display: block; color: #261548; font-size: 12px; font-weight: 760; }
      .field span { color: var(--emy-orange); }
      .control { margin-top: 6px; }
      input { width: 100%; height: 42px; border: 1px solid #d6d0cc; border-radius: 7px; background: white; color: var(--emy-navy); padding: 0 12px; outline: none; font-size: 13px; font-weight: 500; }
      input::placeholder { color: #9b95a2; }
      input:focus { border-color: var(--emy-orange); box-shadow: 0 0 0 3px rgba(255,106,0,.10); }
      .primary { display: block; width: min(100%, 300px); height: 46px; margin: 24px auto 0; border: 0; border-radius: 10px; background: var(--emy-orange); color: white; cursor: pointer; font-size: 15px; font-weight: 760; box-shadow: 0 12px 24px rgba(255,106,0,.18); }
      .primary:hover { background: #f05f00; }
      .status { min-height: 18px; margin: 14px auto 0; text-align: center; color: #b42318; font-size: 12.5px; line-height: 1.4; font-weight: 600; }
      @media (max-height: 620px) {
        .wrap { padding-top: 42px; }
        h1 { margin-top: 18px; }
        .note { margin-top: 16px; }
        .primary { margin-top: 18px; }
      }
    </style>
      <link rel="stylesheet" href="assets/emy-responsive-hover.css" data-emy-responsive-hover-style />
      <!-- emy-real-backend:start -->
    <script data-emy-real-backend-inline defer src="emy-account-runtime.js"></script>
    <script data-emy-real-backend-loader defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script data-emy-real-backend-loader defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script data-emy-real-backend-loader defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script data-emy-real-backend-loader defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
    <!-- emy-real-backend:end -->
  </head>
  <body>
    <main class="page">
      <div class="marks" aria-hidden="true">
        <svg class="mark-top" viewBox="0 0 180 180" fill="none"><path d="M20 10l65 135L160 5" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="mark-bottom" viewBox="0 0 360 240" fill="none"><path d="M0 210L70 55l66 155 45-88 60 88 42-58 56 58" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <button class="back" type="button" data-back aria-label="Back to Sign In">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 19 8 12l7-7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <section class="wrap" aria-label="Forgot password">
        <div class="brand"><img src="https://iqlance-demo.com/design/EMY-Web/img/logo-landing.png" alt="EMY" /></div>
        <h1>Forgot Password?</h1>
        <p class="intro">Enter the email associated with your account.</p>
        <p class="note">We will email you a secure Firebase password reset link.</p>
        <form data-form novalidate>
          <label class="field">Email<span>*</span>
            <div class="control"><input data-email type="email" placeholder="Email" autocomplete="email" /></div>
          </label>
          <p class="status" data-status></p>
          <button class="primary" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search || "");
        const role = String(params.get("role") || "customer").toLowerCase() === "business" ? "business" : "customer";
        const email = document.querySelector("[data-email]");
        const status = document.querySelector("[data-status]");
        const prefill = params.get("email") || "";
        if (prefill) email.value = prefill;
        document.querySelector("[data-back]").addEventListener("click", () => {
          window.location.href = "emy-signin.html?role=" + encodeURIComponent(role);
        });
        document.querySelector("[data-form]").addEventListener("submit", async (event) => {
          event.preventDefault();
          status.style.color = "#b42318";
          if (!email.value.trim()) {
            status.textContent = "Please enter your email address.";
            email.focus();
            return;
          }
          if (!window.emyRealAuth) {
            status.textContent = "Firebase account backend is still loading. Refresh and try again.";
            return;
          }
          status.style.color = "#61708c";
          status.textContent = "Sending your secure password reset email...";
          try {
            await window.emyRealAuth.sendPasswordReset(email.value.trim());
            localStorage.setItem("emyMainPasswordResetRole", role);
            localStorage.setItem("emyMainPasswordResetEmail", email.value.trim());
            status.style.color = "#0f7a45";
            status.textContent = "Password reset email sent to " + email.value.trim() + ".";
          } catch (error) {
            status.style.color = "#b42318";
            status.textContent = window.emyRealAuth && window.emyRealAuth.publicError ? window.emyRealAuth.publicError(error) : (error.message || "Password reset failed.");
          }
        });
      })();
    </script>
      <script defer src="assets/emy-account-session-nav.js" data-emy-account-session-nav></script>
  </body>
</html>
